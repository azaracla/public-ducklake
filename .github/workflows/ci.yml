name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> $GITHUB_PATH

      - name: Check Parquet URLs are reachable
        run: |
          echo "Checking remote Parquet URLs..."
          urls=(
            "https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-ips-ecoles-ap2022/exports/parquet"
            "https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-indice_eloignement_lycee_ap2020/exports/parquet"
            "https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-indicateurs-de-resultat-des-lycees-gt_v2/exports/parquet"
            "https://static.data.gouv.fr/resources/recensement-de-la-population-fichiers-detail-logements-ordinaires/20231023-123618/fd-logemt-2020.parquet"
            "https://static.data.gouv.fr/resources/recensement-de-la-population-fichiers-detail-logements-ordinaires/20250212-094137/fd-logemt-2021.parquet"
            "https://static.data.gouv.fr/resources/recensement-de-la-population-fichiers-detail-individus-localises-au-canton-ou-ville-2020-1/20231023-122841/fd-indcvi-2020.parquet"
            "https://static.data.gouv.fr/resources/recensement-de-la-population-fichiers-detail-individus-localises-au-canton-ou-ville-2020-1/20250211-164757/rp2021-indcvi.parquet"
          )
          failed=0
          for url in "${urls[@]}"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            if [ "$status" = "200" ]; then
              echo "  ✅ $url"
            else
              echo "  ❌ HTTP $status $url"
              failed=$((failed + 1))
            fi
          done
          echo "---"
          if [ $failed -gt 0 ]; then
            echo "⚠️  $failed URL(s) unreachable (may be transient)"
          else
            echo "✅ All URLs reachable"
          fi

      - name: List tables in catalog
        run: |
          duckdb -c "
            INSTALL ducklake;
            LOAD ducklake;
            INSTALL httpfs;
            LOAD httpfs;

            ATTACH 'ducklake:data_gouv_catalog.ducklake' AS dg (READ_ONLY true);
            USE dg;

            SELECT table_schema, table_name, comment
            FROM duckdb_tables()
            WHERE database_name = 'dg'
            ORDER BY table_schema, table_name;
          "

      - name: Query education tables (small datasets)
        run: |
          for table in \
            "education.ips_ecoles" \
            "education.indice_eloignement_lycees" \
            "education.indicateur_valeur_ajoutee_lycees_gt"; do
            echo "--- $table ---"
            duckdb -c "
              INSTALL ducklake; LOAD ducklake;
              INSTALL httpfs; LOAD httpfs;
              SET force_download=true;
              ATTACH 'ducklake:data_gouv_catalog.ducklake' AS dg (READ_ONLY true);
              USE dg;
              SELECT '$table' AS table_name, COUNT(*) AS row_count FROM $table;
            " && echo "  ✅ $table" || echo "  ❌ $table"
          done

      - name: Query demography tables (medium datasets)
        run: |
          for table in \
            "demographie.recensement_logements_2020" \
            "demographie.recensement_logements_2021"; do
            echo "--- $table ---"
            duckdb -c "
              INSTALL ducklake; LOAD ducklake;
              INSTALL httpfs; LOAD httpfs;
              SET force_download=true;
              ATTACH 'ducklake:data_gouv_catalog.ducklake' AS dg (READ_ONLY true);
              USE dg;
              SELECT '$table' AS table_name, COUNT(*) AS row_count FROM $table;
            " && echo "  ✅ $table" || echo "  ❌ $table"
          done
          for table in \
            "demographie.recensement_individus_2020" \
            "demographie.recensement_individus_2021"; do
            echo "--- $table (LIMIT 1) ---"
            duckdb -c "
              INSTALL ducklake; LOAD ducklake;
              INSTALL httpfs; LOAD httpfs;
              SET force_download=true;
              ATTACH 'ducklake:data_gouv_catalog.ducklake' AS dg (READ_ONLY true);
              USE dg;
              SELECT '$table' AS table_name, COUNT(*) AS columns FROM (
                SELECT column_name FROM information_schema.columns
                WHERE table_catalog = 'dg' AND table_schema = 'demographie' AND table_name = '$table'
              );
            " && echo "  ✅ $table (schema OK)" || echo "  ❌ $table"
            duckdb -c "
              INSTALL ducklake; LOAD ducklake;
              INSTALL httpfs; LOAD httpfs;
              SET force_download=true;
              ATTACH 'ducklake:data_gouv_catalog.ducklake' AS dg (READ_ONLY true);
              USE dg;
              SELECT '$table' AS table_name, * FROM $table LIMIT 1;
            " && echo "  ✅ $table (data accessible)" || echo "  ❌ $table"
          done

      - name: Query enterprise tables (large datasets - LIMIT 1)
        run: |
          for table in \
            "entreprises.annuaire_etablissements" \
            "entreprises.annuaire_unites_legales" \
            "entreprises.beaamp_2025" \
            "entreprises.donnees_financieres" \
            "entreprises.sirene_etablissements" \
            "entreprises.sirene_etablissements_historique" \
            "entreprises.sirene_unites_legales" \
            "entreprises.sirene_unites_legales_historique"; do
            echo "--- $table (LIMIT 1) ---"
            duckdb -c "
              INSTALL ducklake; LOAD ducklake;
              INSTALL httpfs; LOAD httpfs;
              SET force_download=true;
              ATTACH 'ducklake:data_gouv_catalog.ducklake' AS dg (READ_ONLY true);
              USE dg;
              SELECT '$table' AS table_name, * FROM $table LIMIT 1;
            " && echo "  ✅ $table" || echo "  ❌ $table"
          done

      - name: Cross-schema query test
        run: |
          duckdb -c "
            INSTALL ducklake; LOAD ducklake;
            INSTALL httpfs; LOAD httpfs;
            SET force_download=true;
            ATTACH 'ducklake:data_gouv_catalog.ducklake' AS dg (READ_ONLY true);
            USE dg;

            WITH dept_ips AS (
              SELECT code_du_departement AS dept_code,
                     AVG(CASE WHEN ips ~ '^[0-9]+(\.[0-9]+)?\$' THEN CAST(ips AS DOUBLE) ELSE NULL END) AS avg_ips,
                     COUNT(DISTINCT uai) AS nb_ecoles
              FROM education.ips_ecoles
              WHERE ips IS NOT NULL AND ips != ''
              GROUP BY code_du_departement
            ),
            dept_pop AS (
              SELECT DEPT, COUNT(DISTINCT NUMMI) AS population
              FROM demographie.recensement_individus_2021
              GROUP BY DEPT
            )
            SELECT i.dept_code, i.avg_ips, p.population, i.nb_ecoles
            FROM dept_ips i
            JOIN dept_pop p ON i.dept_code = p.DEPT
            ORDER BY i.avg_ips DESC
            LIMIT 5;
          " && echo "  ✅ Cross-schema query" || echo "  ❌ Cross-schema query"
